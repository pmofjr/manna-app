<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manna — Redefinir Senha</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0F1E2E;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 24px;
      padding: 40px 36px;
    }
    .logo { height: 36px; margin-bottom: 32px; display: block; }
    h2 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 1.6rem; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.55); font-size: 0.88rem; line-height: 1.6; margin-bottom: 24px; }
    .input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      padding: 14px 16px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .input:focus { border-color: rgba(201,168,76,0.3); }
    .input-wrap { position: relative; }
    .input-wrap .input { padding-right: 44px; margin-bottom: 0; }
    .eye-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: rgba(255,255,255,0.4);
      cursor: pointer; padding: 0; font-size: 1rem;
    }
    .btn {
      width: 100%;
      background: #C9A84C;
      color: #0F1E2E;
      border: none;
      border-radius: 50px;
      padding: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }
    .btn:hover { background: #E8D5A3; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { font-size: 0.82rem; padding: 10px 14px; border-radius: 10px; margin-top: 12px; }
    .error { background: rgba(220,50,50,0.1); border: 1px solid rgba(220,50,50,0.3); color: #ff8080; }
    .success { background: rgba(50,200,100,0.1); border: 1px solid rgba(50,200,100,0.3); color: #80ffaa; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/logo-manna.png" alt="Manna" class="logo">
    <h2>Nova senha</h2>
    <p>Digite sua nova senha abaixo. Mínimo de 6 caracteres.</p>
    <div class="input-wrap" style="margin-bottom:12px">
      <input class="input" type="password" id="password" placeholder="Nova senha" />
      <button class="eye-btn" onclick="togglePwd('password', this)">👁</button>
    </div>
    <div class="input-wrap">
      <input class="input" type="password" id="confirm" placeholder="Confirmar nova senha" />
      <button class="eye-btn" onclick="togglePwd('confirm', this)">👁</button>
    </div>
    <button class="btn" id="btn" onclick="resetPassword()">Redefinir senha</button>
    <div id="msg"></div>
  </div>

  <script>
    function getParams() {
      const p = new URLSearchParams(window.location.search)
      return { token: p.get('token'), email: p.get('email') }
    }

    function togglePwd(id, btn) {
      const input = document.getElementById(id)
      input.type = input.type === 'password' ? 'text' : 'password'
      btn.textContent = input.type === 'password' ? '👁' : '🙈'
    }

    async function resetPassword() {
      const { token, email } = getParams()
      const password = document.getElementById('password').value
      const confirm = document.getElementById('confirm').value
      const msg = document.getElementById('msg')
      const btn = document.getElementById('btn')

      if (!token || !email) {
        msg.innerHTML = '<div class="msg error">Link inválido. Solicite uma nova recuperação de senha.</div>'
        return
      }
      if (password.length < 6) {
        msg.innerHTML = '<div class="msg error">Senha deve ter ao menos 6 caracteres.</div>'
        return
      }
      if (password !== confirm) {
        msg.innerHTML = '<div class="msg error">As senhas não coincidem.</div>'
        return
      }

      btn.disabled = true
      btn.textContent = 'Aguarde...'

      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, email, newPassword: password })
      })
      const data = await res.json()

      if (res.ok) {
        msg.innerHTML = '<div class="msg success">Senha redefinida com sucesso! Redirecionando...</div>'
        setTimeout(() => window.location.href = '/', 2500)
      } else {
        msg.innerHTML = `<div class="msg error">${data.error}</div>`
        btn.disabled = false
        btn.textContent = 'Redefinir senha'
      }
    }
  </script>
</body>
</html>
